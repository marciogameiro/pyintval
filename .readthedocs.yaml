version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Install the published pyintval wheel (plus its docs extra) from PyPI rather
# than compiling the C++ extension on every build -- faster, and autodoc then
# documents the released API. See docs/requirements.txt.
python:
  install:
    - requirements: docs/requirements.txt
