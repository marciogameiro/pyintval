version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Build and install the package (compiling the extension with the system GCC,
# which supports the CORE-MATH kernels on Linux) so autodoc can import it.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
