version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Build and install the package FROM SOURCE (compiling the extension with the
# system GCC, which supports the CORE-MATH kernels on Linux) so autodoc imports
# the exact code on the branch/tag being built -- no PyPI dependency and no
# release-time race, so every version's docs are correct. The [docs] extra adds
# Sphinx, Furo, and MyST-parser.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
