name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      # Validate wheel builds when packaging-relevant files change.
      - "pyproject.toml"
      - "CMakeLists.txt"
      - ".github/workflows/release.yml"
      - "third_party/**"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Where to publish (manual runs only)"
        type: choice
        options: ["none", "testpypi", "pypi"]
        default: "none"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels ${{ matrix.os }} ${{ matrix.archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, archs: x86_64 }
          - { os: ubuntu-24.04-arm, archs: aarch64 }
          - { os: macos-14, archs: arm64 }
          - { os: macos-13, archs: x86_64 }
          - { os: windows-latest, archs: AMD64 }
    steps:
      - uses: actions/checkout@v4
      # clang-cl needs the MSVC headers/libs/Windows SDK on INCLUDE/LIB/PATH;
      # these persist into the cibuildwheel build subprocess.
      - name: Activate MSVC toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - name: Verify the sdist builds and imports
        run: |
          python -m pip install dist/*.tar.gz
          python -c "import pyintval as iv; print(iv.exp(iv.Interval(0, 1)))"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish_testpypi:
    name: Publish to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Real releases happen only on a version tag; a manual run can force it.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
