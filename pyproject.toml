[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "pyintval"
version = "0.1.0.dev0"
description = "Rigorous interval arithmetic with correctly rounded double-precision endpoints (IEEE 1788 set-based flavor)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcio Gameiro", email = "marciogameiro@gmail.com" }]
keywords = [
  "interval arithmetic",
  "rigorous numerics",
  "verified computation",
  "IEEE 1788",
  "correct rounding",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/marciogameiro/pyintval"
Issues = "https://github.com/marciogameiro/pyintval/issues"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
dev = ["pytest>=8", "hypothesis>=6", "pre-commit", "ruff"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
wheel.packages = ["src/pyintval"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
