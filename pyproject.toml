[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "pyintval"
version = "0.2.0"
description = "Rigorous interval arithmetic with correctly rounded double-precision endpoints (IEEE 1788 set-based flavor)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcio Gameiro", email = "marciogameiro@gmail.com" }]
keywords = [
  "interval arithmetic",
  "rigorous numerics",
  "verified computation",
  "IEEE 1788",
  "correct rounding",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/marciogameiro/pyintval"
Issues = "https://github.com/marciogameiro/pyintval/issues"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "mpmath>=1.3"]
docs = ["sphinx>=7", "furo", "myst-parser>=2"]
dev = ["pytest>=8", "hypothesis>=6", "mpmath>=1.3", "pre-commit", "ruff"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
wheel.packages = ["src/pyintval"]
# The sdist must carry the header-only kernel and the vendored CORE-MATH
# sources so it can be built from source on the user's machine.
sdist.include = [
  "CMakeLists.txt",
  "include/**",
  "src/**",
  "third_party/**",
  "tests/**",
]

[tool.cibuildwheel]
# Build every stable CPython the installed cibuildwheel supports at or above the
# project's requires-python floor (3.10). PyPy and free-threaded builds are
# opt-in in cibuildwheel and left disabled, so only musllinux and 32-bit targets
# need skipping. (Not enumerating cpXY keeps this working as newer Pythons
# appear -- just bump the cibuildwheel action version in release.yml.)
skip = "*-musllinux* *_i686 *-win32"
build-frontend = "build"
# Use the newer manylinux image (AlmaLinux 8, GCC 12) rather than the default
# manylinux2014 (GCC 10). GCC 10 miscompiles the fused directed-rounding kernel
# so badly that the extension segfaults at import; GCC 12 (like the GCC 13/14 on
# the ubuntu-latest CI jobs) compiles it correctly. Cost: wheels require
# glibc >= 2.28 (i.e. not RHEL/CentOS 7), which is fine for a modern package.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# Every wheel is exercised against the full test suite (incl. the mpmath
# oracle) so the ARM64 CORE-MATH fallbacks and the Windows ClangCL build are
# verified on the actual target, not just reasoned about.
test-extras = ["test"]
test-command = "pytest {project}/tests/python"

[tool.cibuildwheel.windows]
# CORE-MATH needs Clang/GCC features MSVC lacks; build with clang-cl + Ninja.
# The MSVC toolchain environment (INCLUDE/LIB/Windows SDK that clang-cl links
# against) is activated by ilammy/msvc-dev-cmd in the release workflow before
# cibuildwheel runs, and inherited by the build subprocess.
environment = { CMAKE_GENERATOR = "Ninja", CC = "clang-cl", CXX = "clang-cl" }

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `I` is the conventional one-letter alias for Interval in the test suite.
"tests/**" = ["E741"]
